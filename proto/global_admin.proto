syntax = "proto3";

import "permissionrules.proto";

option go_package = "github.com/momentohq/client-sdk-go;client_sdk_go";
option java_multiple_files = true;
option java_package = "grpc.global_admin";
option csharp_namespace = "Momento.Protos.GlobalAdmin";

package global_admin;

service GlobalAdmin {
  rpc GetAccounts(_GetAccountsRequest) returns (_GetAccountsResponse) {}
  rpc GetInvitationsForUser(_GetInvitationsForUserRequest) returns (_GetInvitationsForUserResponse) {}
  rpc GetAccountSessionToken (_GetAccountSessionTokenRequest) returns(_GetAccountSessionTokenResponse) {}
  rpc RemoveMember(_RemoveMemberRequest) returns(_RemoveMemberResponse) {}
  rpc ListMembers(_ListMembersRequest) returns(_ListMembersResponse) {}
  rpc GetEndpointsForAccount(_GetEndpointsForAccountRequest) returns (_GetEndpointsForAccountResponse) {}
  rpc SetAccountName(_SetAccountNameRequest) returns (_SetAccountNameResponse) {}
  rpc InviteMember(_InviteMemberRequest) returns (_InviteMemberResponse) {}
  rpc AcceptInvitation(_AcceptInvitationRequest) returns (_AcceptInvitationResponse) {}
  rpc RejectInvitation(_RejectInvitationRequest) returns (_RejectInvitationResponse) {}
  rpc ListInvitationsForAccount(_ListInvitationsForAccountRequest) returns (_ListInvitationsForAccountResponse) {}
  rpc RevokeInvitation(_RevokeInvitationRequest) returns (_RevokeInvitationResponse) {}
  rpc ListRolesForAccount(_ListRolesForAccountRequest) returns (_ListRolesForAccountResponse) {}
  rpc ListRolesForAccountPaginated(_ListRolesForAccountPaginatedRequest) returns (_ListRolesForAccountPaginatedResponse) {}
  rpc CreateCustomRole(_CreateCustomRoleRequest) returns (_CreateCustomRoleResponse) {}
  rpc UpdateCustomRole(_UpdateCustomRoleRequest) returns (_UpdateCustomRoleResponse) {}
  rpc DeleteCustomRole(_DeleteCustomRoleRequest) returns (_DeleteCustomRoleResponse) {}
  rpc SetMemberRole(_SetMemberRoleRequest) returns (_SetMemberRoleResponse) {}
  rpc GenerateGlobalApiKey(_GenerateGlobalApiKeyRequest) returns (_GenerateGlobalApiKeyResponse) {}
  // authenticated with the refresh token itself, in the authorization header
  rpc RefreshGlobalApiKey(_RefreshGlobalApiKeyRequest) returns (_RefreshGlobalApiKeyResponse) {}
  // Deprecated: unpaginated; use ListGlobalApiKeysPaginated instead.
  rpc ListGlobalApiKeys(_ListGlobalApiKeysRequest) returns (stream GlobalApiKey) {}
  rpc ListGlobalApiKeysPaginated(_ListGlobalApiKeysPaginatedRequest) returns (_ListGlobalApiKeysPaginatedResponse) {}
  rpc RevokeGlobalApiKey(_RevokeGlobalApiKeyRequest) returns (_RevokeGlobalApiKeyResponse) {}
}

message _SetAccountNameRequest {
  string account_name = 1;
}

message _SetAccountNameResponse {}

message _GetAccountsRequest {
}

message _GetAccountsResponse {
  repeated _Account accounts = 1;
}

message _GetInvitationsForUserRequest {}

message UserInvitation {
  string account_id = 1;
  string account_name = 2;
  string invitation_id = 3;
}

message _GetInvitationsForUserResponse {
  repeated UserInvitation invitations = 1;
}

message CacheV2Entitlement {
  enum UsageTier {
    NoAccess = 0;
    FreeTier = 1;
    Standard = 2;
  }
  UsageTier usage_tier = 1;
}

message SupportEntitlement {
  enum SupportTier {
    Basic = 0;
    Production = 1;
    Enterprise = 2;
  }
  SupportTier support_tier = 1;
}

message Entitlements {
  CacheV2Entitlement cachev2_entitlement = 1;
  SupportEntitlement support_entitlement = 2;
}

message _Account {
  string id = 1;
  string account_name = 2;
  string role_id = 3;
  string role_name = 4;
  Entitlements entitlements = 5;
}

message _GetAccountSessionTokenRequest {
  string account_id = 1;
}

message _GetAccountSessionTokenResponse {
  string account_session_token = 1;
  permission_rules.PermissionSet permissions = 2;
}

// API Key needs to be provided via the "authorization" header.
// The Account to add the User to is derived from the API key, which is account-scoped.
message _InviteMemberRequest {
  string user_name = 1;
  string role_id = 2;
}

// This response is for when a Member is invited to the Account,
// These are some of the Errors and their corresponding GRPC status codes.
// 1. User is already a Member. grpc code = FAILED_PRECONDITION. Metadata: "err" -> "already_a_member".
// 2. Account has too many Members. grpc code = RESOURCE_EXHAUSTED. Metadata: "err" -> "max_member_count_exceeded".
// 3. Invalid role. grpc code = INVALID_ARGUMENT.
message _InviteMemberResponse {
}

// Auth0 Token needs to be provided via the "authorization" header.
// The user is derived from the Auth0 token and added to the account in the invitation if they match the invitation's user.
message _AcceptInvitationRequest {
  string invitation_id = 1;
}

message _AcceptInvitationResponse {
}

// Auth0 Token needs to be provided via the "authorization" header.
// The user is derived from the Auth0 token and the invitation is rejected if they match the invitation's user.
// Reject is called by a user to reject an offered invitation.
message _RejectInvitationRequest {
  string invitation_id = 1;
}

message _RejectInvitationResponse {
}

// Account Session Token provides relevant account.
message _ListInvitationsForAccountRequest {}

message _Invitation {
  string id = 1;
  _Member member = 2; // TODO: deprecate after migrating to new roles
  _AccountMember account_member = 3;
}

message _ListInvitationsForAccountResponse {
  repeated _Invitation invitations = 1;
}

// Revoke is called by an account member to revoke a pending invitation in that account.
message _RevokeInvitationRequest {
  string invitation_id = 1;
}

message _RevokeInvitationResponse {}

// API Key needs to be provided via the "authorization" header.
// The Account to remove the User from is derived from the API key, which is account-scoped.
message _RemoveMemberRequest {
  string user_name = 1;
}

// This response is for when a Member is removed successfully from an Account.
// These are some of the Errors and their corresponding GRPC status codes:
// 1. User is not a Member. grpc code = FAILED_PRECONDITION. Metadata: "err" -> "user_is_not_a_member".
// 2. a non-owner Member may not be removed. grpc code = PERMISSION_DENIED. Metadata: "err" -> "owner_cannot_be_removed".
//
// Note that to remove an Owner, customers need to reach out to us so we can run mm commands for them.
message _RemoveMemberResponse {
}

// API Key needs to be provided via the "authorization" header.
// The Account to list the Users is derived from the API key, which is account-scoped.
message _ListMembersRequest {
}

enum Role {
  OWNER = 0;
  OPERATOR = 1;
}

message _Member {
  string user_name = 1;
  Role role = 2;
}

message _AccountMember {
  string user_name = 1;
  string role_id = 2;
  string role_name = 3;
}

message _ListMembersResponse {
  repeated _Member members = 1; // TODO: Deprecate this once we migrate to new roles
  repeated _AccountMember account_members = 2;
}

// API Key needs to be provided via the "authorization" header.
// The Account is derived from the API key, which is account-scoped.
message _GetEndpointsForAccountRequest {
}

message _GetEndpointsForAccountResponse {
  repeated Endpoint endpoints = 1;
}

message Endpoint {
  string friendly_name = 1; // the name displayed in the Console, e.g. 'us-west-2', 'private-us-west-2', etc.
  string domain_name = 2; // domain name for talking to this Endpoint, e.g. `cell-4-us-west-2-1.prod.a.momentohq.com`
  string region = 3; // AWS region, e.g. `us-west-2`
}

message _ListRolesForAccountRequest {
}


enum RoleType {
  SYSTEM = 0;
  CUSTOM = 1;
}

message AccountRole {
  string role_id = 1; // unique identifier
  string role_name = 2; // friendly name
  permission_rules.PermissionSet permissions = 3; // permissions associated with the role
  RoleType role_type = 4; // system or custom role
  optional string description = 5; // role description
}

// This response is when we list all the roles for an account (system roles + custom roles).
// These are the error cases:
// 1. Account does not exist. grpc code = NOT_FOUND. Metadata: "err" -> "account_not_found".
message _ListRolesForAccountResponse {
  repeated AccountRole roles = 1;
}

// Account Session Token provides relevant account.
// These are the error cases:
// 1. Account does not exist. grpc code = NOT_FOUND. Metadata: "err" -> "account_not_found".
// 2. limit is 0 or greater than 100. grpc code = INVALID_ARGUMENT.
// 3. next_token is not a valid token. grpc code = INVALID_ARGUMENT.
message _ListRolesForAccountPaginatedRequest {
  // maximum number of roles to return in one page. unset means the default of 100.
  // must be between 1 and 100.
  optional uint32 limit = 1;
  // opaque pagination cursor from a previous response. empty means start from the beginning.
  string next_token = 2;
  // filter to only system or only custom roles. unset returns both.
  optional RoleType role_type = 3;
}

message _ListRolesForAccountPaginatedResponse {
  repeated AccountRole roles = 1;
  // opaque pagination cursor to pass in the next request. empty means there are no more results.
  string next_token = 2;
}

// Account Session Token provides relevant account.
// These are the error cases:
// 1. permission_set is not provided. grpc code = INVALID_ARGUMENT.
// 2. permission_set uses super_user permissions, which are not allowed for custom roles.
//    grpc code = INVALID_ARGUMENT. Metadata: "err" -> "custom_role_superuser_not_allowed".
// 3. role_name is already in use for this account. grpc code = ALREADY_EXISTS.
//    Metadata: "err" -> "role_name_in_use".
// 4. Account already has the maximum number of custom roles. grpc code = RESOURCE_EXHAUSTED.
//    Metadata: "err" -> "max_custom_role_count_exceeded".
message _CreateCustomRoleRequest {
  string role_name = 1;
  optional string description = 2;
  permission_rules.PermissionSet permission_set = 3;
}

message _CreateCustomRoleResponse {
  AccountRole role = 1;
}

// Account Session Token provides relevant account.
// These are the error cases:
// 1. Role does not exist (or belongs to a different account). grpc code = NOT_FOUND.
//    Metadata: "err" -> "role_not_found".
// 2. Role is a system role. grpc code = FAILED_PRECONDITION.
//    Metadata: "err" -> "system_role_cannot_be_modified".
// 3. permission_set uses super_user permissions, which are not allowed for custom roles.
//    grpc code = INVALID_ARGUMENT. Metadata: "err" -> "custom_role_superuser_not_allowed".
// 4. role_name is already in use for this account. grpc code = ALREADY_EXISTS.
//    Metadata: "err" -> "role_name_in_use".
message _UpdateCustomRoleRequest {
  string role_id = 1;
  string role_name = 2;
  optional string description = 3;
  permission_rules.PermissionSet permission_set = 4;
}

message _UpdateCustomRoleResponse {
  AccountRole role = 1;
}

// Account Session Token provides relevant account.
// These are the error cases:
// 1. Role does not exist (or belongs to a different account). grpc code = NOT_FOUND.
//    Metadata: "err" -> "role_not_found".
// 2. Role is a system role. grpc code = FAILED_PRECONDITION.
//    Metadata: "err" -> "system_role_cannot_be_modified".
message _DeleteCustomRoleRequest {
  string role_id = 1;
}

// Deletion is blocked (not an error) when the role is still assigned to a member,
// invitation, or global API key.
message _DeleteCustomRoleResponse {
  message Deleted {}
  message Blocked {
    repeated _AccountMember account_members = 1;
    repeated _Invitation invitations = 2;
    repeated GlobalApiKey api_keys = 3;
  }

  oneof result {
    Deleted deleted = 1;
    Blocked blocked = 2;
  }
}

message _SetMemberRoleRequest {
  string user_name = 1;
  string desired_role_id = 2;
}

// This response is when a Member has their membership status changed successfully.
// These are the error cases:
// 1. User is not a member. grpc code = NOT_FOUND. Metadata: "err" -> "user_is_not_a_member".
// 2. User already has the desired membership status. grpc code = FAILED_PRECONDITION. Metadata: "err" -> "same_role".
// 3. Last Owner cannot be demoted. grpc code = FAILED_PRECONDITION. Metadata: "err" -> "only_owner_cannot_be_removed".
// 4. User does not exist. grpc code = NOT_FOUND. Metadata: "err" -> "user_not_found".
// 5. Account does not exist. grpc code = NOT_FOUND. Metadata: "err" -> "account_not_found".
// 6. Role does not exist. grpc code = NOT_FOUND. Metadata: "err" -> "role_not_found".
message _SetMemberRoleResponse {
}

// Account Session Token provides relevant account.
message _GenerateGlobalApiKeyRequest {
  string role_id = 1;
  string description = 2;
  oneof expiry {
    Never never = 3;
    Expires expires = 4;
  }

  // generate a token that will never expire
  message Never {}
  // generate a token that has an expiry
  message Expires {
    // how many seconds do you want the api token to be valid for?
    uint64 expiration_epoch_seconds = 1;
  }

  // By default, create a refresh token for an expiring key.
  // Non-expiring keys are never given a refresh token.
  optional bool exclude_refresh_token = 5;
}

message _GenerateGlobalApiKeyResponse {
  // the actual key that will be used for authentication.
  // this is the only time it's produced.
  string api_key = 1;
  // details about the key, can also be retried via the ListGlobalApiKeys endpoint
  GlobalApiKey key_info = 2;
  // present unless the key never expires or exclude_refresh_token was set
  optional string refresh_token = 3;
}

// Authenticated with the refresh token issued for the key.
message _RefreshGlobalApiKeyRequest {
  // when to expire the new key. unset means the new key gets the same lifetime
  // as the original key. May narrow the successor's lifetime, not extend it.
  optional uint64 expiration_epoch_seconds = 1;
}

message _RefreshGlobalApiKeyResponse {
  string api_key = 1;
  string refresh_token = 2;
  GlobalApiKey key_info = 3;
  string previous_key_id = 4;
}

// Account Session Token provides relevant account.
message _ListGlobalApiKeysRequest {}

message GlobalApiKey {
  string key_id = 1;
  string account_id = 2;
  string description = 3;
  string role_id = 4;
  optional uint64 expires_at_epoch_seconds = 5;
  uint64 issued_at_epoch_seconds = 6;
}

// Account Session Token provides relevant account
// as well as user id of the revoking user
// Account Session Token provides relevant account.
// These are the error cases:
// 1. limit is 0 or greater than 100. grpc code = INVALID_ARGUMENT.
// 2. next_token is not a valid token. grpc code = INVALID_ARGUMENT.
message _ListGlobalApiKeysPaginatedRequest {
  // maximum number of keys to return in one page. unset means the default of 100.
  // must be between 1 and 100.
  optional uint32 limit = 1;
  // opaque pagination cursor from a previous response. empty means start from the beginning.
  string next_token = 2;
}

message _ListGlobalApiKeysPaginatedResponse {
  repeated GlobalApiKey api_keys = 1;
  // opaque pagination cursor to pass in the next request. empty means there are no more results.
  string next_token = 2;
}

message _RevokeGlobalApiKeyRequest {
  string key_id = 1;
}

message _RevokeGlobalApiKeyResponse {}
